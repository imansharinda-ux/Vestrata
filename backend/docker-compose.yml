services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vestrata
      POSTGRES_PASSWORD: vestrata
      POSTGRES_DB: vestrata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://vestrata:vestrata@db:5432/vestrata
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  pgdata:
